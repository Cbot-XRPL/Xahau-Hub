# ── ROLE: deep ────────────────────────────────────────────────────────────────
#  xah-node-1. Deep history, rolling window, disk-pressure-driven pruning.
#
#  INVARIANT: ledger_history < online_delete.
#  If ledger_history >= online_delete the node fetches history only to delete
#  it again — endless backfill churn that never converges.
#
#  ledger_history_initial is what actually gets rendered until
#  docs/DECISIONS.md records a measured GB-per-million-ledgers figure. Start
#  low to get a measurement in a reasonable window, then raise toward
#  ledger_history once it is clear the window fits under the 700 GiB cap.
#  Promote with:  make render NODE=xah-node-1 HISTORY=final
# ──────────────────────────────────────────────────────────────────────────────
role: deep
node_size: huge
peers_max: 40

# ── SIZED FROM MEASUREMENT, 2026-09-14 ───────────────────────────────────────
#  Measured on both nodes: ~992 GiB per million ledgers (991.88 / 991.33).
#  The previous values (3.5M target, 2M initial, 4M online_delete) needed
#  3.5 TB, 2 TB and 4 TB against a 700 GiB volume — 5.0x, 2.8x and 5.7x over.
#
#  400,000 ledgers x 991.88 GiB/million = ~397 GiB = 57% of the 700 GiB cap.
#  That sits below the 60% warn threshold, so the node reaches a STEADY STATE
#  bounded by ledger_history rather than by disk pressure. prune-guard goes
#  back to being the safety net it was designed as, instead of the mechanism
#  that was actually holding the line.
#
#  ~400k ledgers is roughly 16 days at ~3.5s per ledger. Raise it only with
#  the arithmetic redone: on the 4 TB NVMe this becomes ~4 million.
#  CORRECTED 2026-09-14 after reading state.db. online_delete is a ROTATION
#  INTERVAL, not a window size. xahaud keeps a writable and an archive backend
#  and frees space only when it DROPS the archive — which happens one full
#  interval after that data stopped being written. So the disk must hold
#  2 x online_delete, not 1x. Observed directly: writable 167 GB, archive 12 KB.
#
#  150,000 x 2 = 300,000 ledgers x 992 GiB/million = ~298 GiB = 43% of 700 GiB.
#  Served history therefore ranges from 150,000 to 300,000 ledgers — roughly
#  6 to 12 days. That is what 700 GiB buys at the measured rate.
#  DEEPENED 2026-10-02, after reclaiming 161 GiB that was never real data.
#  transaction.db had grown to 192.6 GiB holding 40.8 GiB of live pages — 78%
#  of the file was free pages that online_delete had emptied and SQLite never
#  returned. A VACUUM took it to 40 GiB and the volume from 314 GiB used to
#  153 GiB. Pruning was working correctly the whole time; the file simply does
#  not shrink on its own.
#
#  Re-measured per 1000 ledgers on the live node rather than using the blended
#  992 GiB/million: NuDB 0.763 GiB, transaction.db 0.285 GiB. NuDB holds 2x
#  online_delete, the SQLite files hold one ledger_history window:
#
#    200,000 x 2 x 0.763  =  305 GiB   NuDB at peak, just before a rotation
#    180,000 x 0.285      =   51 GiB   transaction.db, freshly vacuumed
#                            --------
#                            ~356 GiB  = 51% of the 700 GiB volume
#
#  That holds even allowing for transaction.db re-bloating, which is the
#  variable to watch: left alone it reached 4.7x its live size. At that
#  multiple the total goes to ~545 GiB (78%), which prune-guard can still
#  defend but which is no longer a steady state. Re-vacuum before raising
#  this again, and see docs/ops/backup-and-dr.md for the SQLITE_TMPDIR trap.
online_delete: 200000
ledger_history: 180000
ledger_history_initial: 180000

advisory_delete: 1                 # nothing prunes until can_delete is called
use_tx_tables: 1                   # account_tx depends on it. NEVER disable.

# SQLite — must be set at FIRST START. Changing later requires `xahaud --vacuum`
# which can run for days on a history server. See docs/DECISIONS.md.
sqlite_page_size: 32768
sqlite_journal_mode: wal
sqlite_synchronous: normal
sqlite_temp_store: file       # NOTE: with temp_store=file, a manual VACUUM
                              #  writes its rebuild to /var/tmp — on the 46 GiB
                              #  ROOT disk, not the data volume. It came within
                              #  ~1 GiB of filling / on 2026-10-02. Always run
                              #  SQLITE_TMPDIR=/var/lib/xahaud/sqlite-tmp.

# Rolling-window pruning is driven by ops/prune-guard.sh from disk pressure,
# not by xahaud's internal count-based schedule.
prune_trigger_pct: 70
