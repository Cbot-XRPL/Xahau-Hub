# ══════════════════════════════════════════════════════════════════════════════
#  inventory.yml — SINGLE SOURCE OF TRUTH for the Xahau node cluster
#
#  Every script in this repo reads this file. Adding node 3 means adding one
#  entry under `nodes:` (flip `enabled: true`) and re-running:
#     make create-vm NODE=xah-node-3
#     make attach-db NODE=xah-node-3
#     make bootstrap NODE=xah-node-3
#     make cluster            # re-renders [cluster_nodes]/[ips_fixed] for ALL
#
#  Parsed by lib/inventory.py (restricted YAML subset: maps, lists, scalars).
# ══════════════════════════════════════════════════════════════════════════════

cluster:
  name: xahau-hub
  network: mainnet
  network_id: 21337
  phase: 1

  # ── Target host. Scripts that run on the host REFUSE to run anywhere else ──
  host:
    name: pve2
    model: R740
    address: 192.168.1.120
    idrac: 192.168.1.105
    pve_version: "9.2-1"
    storage: local-lvm              # thin pool, phase 1
    storage_vg: pve
    storage_thinpool: data
    pool_physical_gib: 1752         # measured: 1837621248 KiB ~= 1752 GiB
    reserve_gib: 256                # MUST stay unprovisioned. No overcommit.
    ssh_user: root

  # ── HARD GUARD LIST ───────────────────────────────────────────────────────
  #  CT 200 on `pve` (R730xd) is a LIVE UNL VALIDATOR with its own RAID and
  #  its own keys. Nothing in this repo may reference, connect to, cluster
  #  with, or copy anything from it. lib/guard.sh enforces this list on every
  #  host-side and ssh-side operation.
  forbidden:
    hosts:
      - pve
      - pve1
      - r730xd
      - r730
    host_addresses:
      - 192.168.1.121               # pve (R730xd) — ADJUST IF WRONG, never remove
    # Never a provisioning target, on any host.
    vmids:
      - 100                         # CT 100 on pve = NPM; VM 100 on pve2 = ai-hub.
                                    # Both off limits. Refusing 100 protects the
                                    # 400 GiB builder VM from ever being clobbered.
      - 200                         # CT 200 on pve — UNL VALIDATOR. NEVER TOUCH.

    # A DIFFERENT question: which VMIDs, if they exist on the machine a
    # host-side script is standing on, prove it is the WRONG machine?
    # Only the validator. VMID 100 exists legitimately on pve2 (ai-hub), so it
    # cannot be used as evidence of being on pve — that is a false positive
    # that blocks all provisioning.
    tripwire_vmids:
      - 200
    reason: >-
      CT 200 on pve (R730xd) is the production UNL validator. It has its own
      storage and its own validator/node keys. This repo must never touch it.
      VMID 100 on pve2 is the local Claude repo builder VM (400 GiB) and VMID
      100 on pve is NPM; both are off limits to provisioning scripts here.

  # ── How a node finds the network at all ──────────────────────────────────
  #  [ips_fixed] does double duty in xahaud: it is how cluster members pin
  #  each other, AND how a brand-new node reaches the Xahau overlay for the
  #  first time. The spec only described the cluster half, which is a trap —
  #  the first node has no cluster peers by definition, so it renders an empty
  #  [ips_fixed] and sits at server_state: disconnected with peers: 0 forever,
  #  looking like a firewall problem.
  #
  #  This value is the one Xahau's own installer ships as its default.
  bootstrap_peers:
    - "bacab.alloy.ee 21337"

  # xahaud keeps its own time sync independent of chrony. Consensus is
  # time-sensitive; a node with a skewed clock is a node that misbehaves
  # subtly rather than obviously.
  sntp_servers:
    - time.cloudflare.com
    - time.google.com
    - pool.ntp.org

  # ── Ports. Admin is 127.0.0.1-only and is NEVER proxied. ──────────────────
  ports:
    rpc_admin: 5005                 # 127.0.0.1 ONLY
    peer: 21337
    ws_public: 6006                 # proxied via NPM
    rpc_public: 5007                # proxied via NPM

  # ── Proxy (already running, do not provision from here) ───────────────────
  proxy:
    kind: nginx-proxy-manager
    location: "CT 100 on pve (R730xd) — DO NOT MODIFY THE CONTAINER FROM HERE"
    admin_url: "https://192.168.1.176:81"

    # ── public path: Cloudflare Tunnel, not port forwarding ──────────────────
    #  client -> Cloudflare edge (TLS ends here) -> cloudflared (tunnel
    #  "onexah") -> NPM 192.168.1.176 -> node.
    #
    #  Consequence worth writing down: the WAN IP is never published and never
    #  needs to be static, so the README's "is the WAN IP static?" blocker does
    #  not apply. Nothing is exposed by forwarding a router port.
    #
    #  Second consequence, less obvious: by the time a request reaches xahaud
    #  its source address has been rewritten twice. Rate limiting belongs at
    #  the Cloudflare edge, where the client address is unambiguous.
    #  The tunnel is FILE-MANAGED, not dashboard-managed: the private repo
    #  Cbot-XRPL/cloudflare-tunnel is cloned on the NPM host, hosts.txt is the
    #  source of truth, and `tunnel-host.sh add <host>` regenerates config.yml,
    #  creates the DNS route and restarts cloudflared in one step. Do not add
    #  CNAMEs by hand — apply runs `route dns --overwrite-dns` over every host.
    public_via: cloudflare-tunnel
    tunnel_name: onexah
    tunnel_repo: "Cbot-XRPL/cloudflare-tunnel"
    tunnel_origin: "https://localhost:443"   # cloudflared is co-located with NPM
    public_hostname_rpc: cluster.cbotlabs.xyz
    public_hostname_ws: ws.cluster.cbotlabs.xyz
    tls: terminated-at-proxy
    proxied_ports: [6006, 5007]

    # ── secure_gateway ───────────────────────────────────────────────────────
    #  The proxy's own address, rendered into the PUBLIC port stanzas so
    #  xahaud trusts X-Forwarded-For from it and accounts resources against
    #  the REAL client.
    #
    #  Without this, every request arrives wearing the proxy's IP. xahaud's
    #  per-client accounting collapses into a single bucket: one abuser
    #  degrades every user at once, and the shared client-abuse accounting
    #  that [cluster_nodes] buys us does nothing, because there is only ever
    #  one apparent client.
    #
    #  It is NOT admin. secure_gateway only makes the forwarded identity
    #  trusted; it grants no privileged methods. It must never appear on
    #  port_rpc_admin_local.
    address: 192.168.1.176

  # ── Monitoring dashboard (dashboard/). READ ONLY, LAN only. ───────────────
  #  Runs as a systemd unit INSIDE a node VM and answers GET on that node's
  #  address. NOT behind the proxy and NOT exposed publicly: it shows
  #  operational detail and has no authentication.
  monitoring:
    enabled: true
    service: xah-dashboard

    # ── WHERE THE DASHBOARD RUNS ─────────────────────────────────────────────
    #  In a VM. NEVER on the Proxmox host: the host stays clean, and a
    #  monitoring service is exactly the kind of thing that accretes packages,
    #  units and open ports on a box that should only run guests. The collector
    #  refuses to start if it detects a PVE host, and dashboard/install.sh
    #  refuses a target that resolves to cluster.host.
    #
    #  It runs ON a node rather than on the ai-hub ops box for one practical
    #  reason: a node gives us root, so the unit is installed, enabled and
    #  survives reboot with no human in the loop. ai-hub would need an
    #  interactive sudo password every time.
    #
    #  The cost is honest: if this node is down, its own dashboard is down with
    #  it. The fix is not a third box, it is a SECOND instance — once
    #  xah-node-2 exists, install there too (monitoring.node accepts one name;
    #  run install.sh --node xah-node-2 as well). Each instance probes itself
    #  locally and its peer over ssh, so either one can tell you the other died.
    node: xah-node-1
    peers: true                     # probe the other enabled nodes over ssh too

    bind: 0.0.0.0                   # inside the guest; the LAN reaches the node
    port: 8088                      # collides with nothing xahaud binds
    refresh_s: 20                   # collector interval; the page polls faster

  # ── VM defaults applied by provision/10-create-vm.sh ──────────────────────
  defaults:
    ostype: l26
    cpu: host                       # kvm64 hides AES/SHA/AVX -> slow sig verify
    balloon: 0                      # xahaud will not tolerate reclaim
    onboot: 1
    scsihw: virtio-scsi-single
    bridge: vmbr0
    # VERIFIED 2026-09-13 against pve2 and ai-hub: the LAN gateway is .254,
    # not .1. provision/02-net-check.sh confirms it ARPs before any VM is
    # created that depends on it.
    gateway: 192.168.1.254
    netmask_cidr: 24
    nameservers: "192.168.1.254 1.1.1.1 9.9.9.9"
    disk_opts: "iothread=1,discard=on,ssd=1"
    guest_os: "ubuntu-24.04-lts"
    iso: "local:iso/ubuntu-24.04.3-live-server-amd64.iso"
    cloudimg_url: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"

    # ── xahaud install layout ────────────────────────────────────────────────
    #  The official installer lays down /opt/xahaud/... and a systemd unit; we
    #  keep the config at the spec's path and symlink the installer's expected
    #  location to it so both agree. VERIFY the installer URL before first use.
    xahaud_user: xahaud
    xahaud_prefix: /opt/xahaud
    xahaud_bin: /opt/xahaud/bin/xahaud
    xahaud_cfg_dir: /etc/opt/xahaud
    xahaud_cfg: /etc/opt/xahaud/xahaud.cfg
    xahaud_log_dir: /var/log/xahaud
    xahaud_service: xahaud
    # VERIFIED 2026-09-13. It lives in Xahau/mainnet-docker, NOT Xahau/xahaud
    # (that path 404s). Re-check the hash when you deliberately update:
    #   curl -fsSL <url> | sha256sum
    installer_url: "https://raw.githubusercontent.com/Xahau/mainnet-docker/main/xahaud-install-update.sh"
    installer_sha256: "fd89358832a36e08f761f2d469cbe063d873ffde25c79e122ecaa0ff3586a534"
    # The installer writes its own config at $prefix/etc/xahaud.cfg and points
    # ExecStart there. We replace that file with a symlink to xahaud_cfg so
    # there is exactly ONE config, whichever path is used to reach it.
    xahaud_installer_cfg: /opt/xahaud/etc/xahaud.cfg
    ops_dir: /opt/xahau-hub

    # WebSocket hardening, from Xahau's own shipped defaults. A subscribe is a
    # long-lived connection; without a send-queue bound one slow consumer can
    # make the server buffer without limit on its behalf.
    ws_limit: 50000
    ws_send_queue_limit: 20000
    ws_ping_frequency: 10
    db_mount: /var/lib/xahaud
    db_label: xahdb
    db_fs: xfs

  # ── Growth / prune thresholds (see docs/DECISIONS.md) ─────────────────────
  thresholds:
    db_warn_pct: 60                 # growth-watch.sh warn
    db_crit_pct: 80                 # growth-watch.sh loud alert
    pool_warn_pct: 60               # thin pool data% AND metadata%
    pool_crit_pct: 80
    prune_trigger_pct: 70           # prune-guard.sh fires can_delete
    lvm_autoextend_threshold: 80
    lvm_autoextend_percent: 0       # 0 = do not autoextend, alert only
    prune_interval: "0 */2 * * *"
    growth_interval: "0 */6 * * *"
    health_interval: "*/10 * * * *"

# ══════════════════════════════════════════════════════════════════════════════
#  NODES
#  phase 1 = two nodes, 60 GB RAM total, both on local-lvm.
#  Node 3 is a config addition, not a rebuild: flip enabled -> true.
# ══════════════════════════════════════════════════════════════════════════════
nodes:
  - name: xah-node-1
    vmid: 110
    role: deep
    phase: 1
    enabled: true
    public: true
    address: 192.168.1.110
    vcpu: 8
    ram_mb: 32768
    root_gib: 48
    db_gib: 700                     # containment boundary, NOT a hw limit
    storage: local-lvm
    db_storage: local-lvm
    ssh_user: root
    seed_var: XAH_NODE_1_SEED
    notes: >-
      Deep history node. Backfills first. Keep OUT of the public pool until
      latency is characterised; deep queries route here explicitly.

  - name: xah-node-2
    vmid: 111
    role: api
    phase: 1
    enabled: true
    public: true
    address: 192.168.1.111
    vcpu: 6
    ram_mb: 28672
    root_gib: 48
    db_gib: 300
    storage: local-lvm
    db_storage: local-lvm
    ssh_user: root
    seed_var: XAH_NODE_2_SEED
    notes: >-
      General API node. Seeded from node 1 via ops/seed-node.sh, never
      backfilled independently from the network. Primary public upstream.

  # ── PHASE 2 — after the 384 GB RAM upgrade and the 4 TB NVMe. ─────────────
  #    Set enabled: true and follow docs/PHASE-2.md. Nothing else changes.
  - name: xah-node-3
    vmid: 112
    role: api
    phase: 2
    enabled: false
    public: true
    address: 192.168.1.112
    vcpu: 8
    ram_mb: 32768
    root_gib: 48
    db_gib: 400                     # from nvme-vg free space
    storage: local-lvm              # root stays on the RAID 10
    db_storage: nvme-vg             # DB on NVMe (see provision/00-nvme-setup.sh)
    ssh_user: root
    seed_var: XAH_NODE_3_SEED
    notes: >-
      Phase 2 only. Requires RAM upgrade (384 GB) AND the NVMe installed.
      Role may be flipped to `deep` if measured GB/million justifies it.

# ══════════════════════════════════════════════════════════════════════════════
#  PHASE 1.5 — NVMe layout, consumed by provision/00-nvme-setup.sh
#  Hardware NOT YET PRESENT. Install the x4 adapter in slot 2, 3, 5 or 7 and
#  leave the x16 slots (1, 4, 8) free for a future GPU.
# ══════════════════════════════════════════════════════════════════════════════
nvme:
  device: /dev/nvme0n1
  vg: nvme-vg
  pve_storage_id: nvme-lvm
  expected_size_tb: 4
  pcie_slots_allowed: [2, 3, 5, 7]
  pcie_slots_reserved_for_gpu: [1, 4, 8]
  volumes:
    - node: xah-node-1
      lv: lv-xah1-db
      size_gib: 1000
    - node: xah-node-2
      lv: lv-xah2-db
      size_gib: 400
  # remainder stays unallocated: node 3 + headroom to raise caps
